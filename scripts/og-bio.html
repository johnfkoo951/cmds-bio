<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Yohan Koo Bio OG</title>
<style>
@font-face {
    font-family: "Pretendard";
    src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/Pretendard-Bold.otf") format("opentype");
    font-weight: 700;
}
@font-face {
    font-family: "Pretendard";
    src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/Pretendard-Regular.otf") format("opentype");
    font-weight: 400;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
    font-family: "SF Pro Display", "SF Pro Text", "Pretendard", system-ui, sans-serif;
    background: #eef1ef;
    color: #0a0d0b;
    padding: 44px 56px;
}
.card {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 270px;
    grid-template-rows: 76px 1fr 88px;
    background: #fbfbfa;
    border: 1px solid #d7dcd9;
    border-radius: 8px;
    overflow: hidden;
}
.brand {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    background: #134538;
    color: #ffffff;
    border-bottom: 6px solid #E985A2;
}
.brand-lockup { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
.brand-lockup img { width: 38px; height: 38px; object-fit: contain; }
.domain { font: 600 16px "SF Mono", ui-monospace, monospace; }
.copy { align-self: center; padding: 30px 34px 26px 48px; min-width: 0; }
.eyebrow { color: #134538; font-size: 17px; font-weight: 700; margin-bottom: 14px; }
h1 { font-size: 62px; line-height: 1.04; letter-spacing: 0; margin-bottom: 16px; }
h1 span { color: #134538; font-size: 40px; }
.role { font-size: 22px; font-weight: 700; line-height: 1.35; margin-bottom: 12px; }
.message { color: #4a544f; font-size: 19px; line-height: 1.45; max-width: 720px; }
.photo-wrap { align-self: stretch; padding: 28px 34px 24px 0; display: flex; align-items: center; }
.photo {
    width: 236px;
    height: 276px;
    object-fit: cover;
    object-position: center 22%;
    border: 6px solid #ffffff;
    outline: 1px solid #cfd5d1;
    border-radius: 8px;
}
.metrics {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid #d7dcd9;
    background: #ffffff;
}
.metric { min-width: 0; padding: 16px 26px; border-right: 1px solid #e1e5e2; }
.metric:last-child { border-right: 0; }
.metric strong { display: block; font-size: 22px; }
.metric span { display: block; margin-top: 4px; color: #69726d; font-size: 12px; line-height: 1.35; }
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="brand-lockup"><img src="../assets/cmds-icon-white.png" alt=""><span>CMDSPACE</span></div>
        <div class="domain">bio.cmdspace.work</div>
    </div>
    <div class="copy">
        <div class="eyebrow">Founder &amp; Principal Context Architect</div>
        <h1>구요한 <span>Yohan Koo</span></h1>
        <div class="role">기업 AX·컨텍스트 수석 설계자</div>
        <p class="message">AI가 일하게 만드는 지식 구조를 설계합니다.</p>
    </div>
    <div class="photo-wrap"><img class="photo" src="../assets/profile-yohan-headshot.jpg" alt=""></div>
    <div class="metrics">
        <div class="metric"><strong>855명</strong><span>그룹 임원 대상 프로그램</span></div>
        <div class="metric"><strong>15명·8.5h</strong><span>회장단·CEO 프로그램</span></div>
        <div class="metric"><strong>450+</strong><span>강의·코칭·연구·자문 활동 기록</span></div>
        <div class="metric"><strong>1만여</strong><span>CMDS 지식 파일</span></div>
    </div>
</div>
</body>
</html>
